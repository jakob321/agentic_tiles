[package]
name = "agentic-tiles"
version = "0.4.1"
description = "A tiled workspace for parallel Codex CLI conversations"
authors = ["Jakob Osterberg"]
edition = "2021"

[lib]
name = "agentic_tiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
